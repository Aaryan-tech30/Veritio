<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Android Login — Minimal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #eef2f5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
    color: #1a2b3c;
  }
  .phone {
    width: 360px;
    height: 780px;
    background: #ffffff;
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(30, 60, 90, .18), 0 2px 6px rgba(30,60,90,.10);
    border: 1px solid #e2e8ef;
    display: flex;
    flex-direction: column;
  }
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: #1a2b3c;
  }
  .statusbar .icons { letter-spacing: 4px; font-size: 12px; }
  .screen { padding: 28px 24px 20px; display: flex; flex-direction: column; flex: 1; }
  .logo {
    width: 56px; height: 56px;
    border-radius: 18px;
    background: #e8f4fe;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; color: #2aa3e8;
    margin-top: 18px;
  }
  h1 { font-size: 26px; font-weight: 750; letter-spacing: -.3px; margin-top: 20px; }
  .sub { font-size: 14px; color: #63798c; margin-top: 6px; }
  label { font-size: 13px; font-weight: 600; color: #33475b; margin: 18px 0 7px; display: block; }
  input {
    width: 100%;
    height: 50px;
    border: 1.5px solid #dde6ee;
    border-radius: 12px;
    padding: 0 14px;
    font-size: 15px;
    outline: none;
    background: #fbfdff;
    color: #1a2b3c;
  }
  input:focus { border-color: #5bb8f5; background: #fff; }
  .row { display: flex; justify-content: flex-end; margin-top: 10px; }
  .row a { font-size: 13px; font-weight: 600; color: #2aa3e8; text-decoration: none; }
  .login-btn {
    margin-top: 22px;
    height: 52px;
    border: 0;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, #a8e0ff 0%, #5bb8f5 100%);
    box-shadow: 0 8px 20px rgba(91, 184, 245, .35);
  }
  .login-btn:active { filter: brightness(.97); }
  .divider {
    display: flex; align-items: center; gap: 12px;
    color: #8ba0b3; font-size: 12.5px; margin: 22px 0 14px;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e3ebf1; }
  .google-btn {
    height: 50px;
    border: 1.5px solid #dde6ee;
    border-radius: 12px;
    background: #fff;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    color: #33475b;
  }
  .signup { margin-top: auto; text-align: center; font-size: 13.5px; color: #63798c; padding-top: 24px; }
  .signup a { color: #2aa3e8; font-weight: 700; text-decoration: none; }
  .hint { text-align: center; font-size: 11.5px; color: #9db0c1; margin-top: 14px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span class="icons">● ● ●</span></div>
    <div class="screen">
      <div class="logo">◍</div>
      <h1>Welcome back</h1>
      <p class="sub">Log in to continue</p>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" />

      <label for="pass">Password</label>
      <input id="pass" type="password" placeholder="••••••••" />

      <div class="row"><a href="#">Forgot password?</a></div>

      <button class="login-btn" onclick="document.querySelector('.hint').textContent='Login tapped (UI demo only)'">Log In</button>

      <div class="divider">Or continue with</div>
      <button class="google-btn">G&nbsp;&nbsp;Google</button>

      <p class="signup">New here? <a href="#">Create account</a></p>
      <p class="hint">360 × 780 Android frame • minimal</p>
    </div>
  </div>
</body>
</html>
